[package]
name = "gnss-defense-edge"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "GNSS Defense Edge — On-Board Spoofing Detector (Tier 1, Kościuszkon 2026)"

[dependencies]
# GUI
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.30"
egui_plot = "0.30"

# ONNX inference (TWO sessions: TEXBAT L1, AISSOU L2)
# default features enable std + ndarray + download-binaries + copy-dylibs.
# download-binaries pulls a pre-built libonnxruntime at build time so we don't
# need a system install. std is required for ort::Error: std::error::Error.
ort = { version = "=2.0.0-rc.10" }
ndarray = "0.16"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

# WebSocket client
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2.5"

# Logging & errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

# Concurrency
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
